<style>
  :root{
    --bg:#0f1216;

    --bg-elev2:#1e242c;
    --border:#2a313b;

    --accent:#4fd1c5;

    --danger:#e0687a;

  body{

    background:var(--bg);

  .req-item .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .req-item .type{font-size:14px;font-weight:600;}

  .person-body{border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:12px;background:var(--bg);}

  .action-row{display:flex;gap:8px;margin-top:10px;}
  .action-row .btn{margin-top:0;}

  .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:24px 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-elev2);

  .file-input-row input[type=file]{display:none;}
  .preview-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .month-filter{display:flex;gap:8px;margin-bottom:14px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;
    justify-content:center;z-index:1000;padding:20px;}
  .modal-overlay img{max-width:100%;max-height:85vh;border-radius:10px;}
</style>
</head>

// ==================== 1. ส่งคำร้องขอลา ====================
function renderRequestForm(){
  app.innerHTML = `
    ${header('ส่งคำร้องขอลา', true)}
    <div class="card">
      <label>ชื่อ</label>
      <input id="f_first" type="text" placeholder="ชื่อ">

      <label>ประเภทการลา</label>
      <select id="f_type">

        <option value="ลาป่วย">ลาป่วย</option>

      </select>

      <div class="date-row">
        <select id="f_sday" class="dtpart">${dayOptions()}</select>

        <select id="f_syear" class="dtpart">${yearOptions()}</select>
      </div>
      <label>เวลาเริ่มลา (24 ชม.)</label>
      <div class="time-row">
        <select id="f_shour" class="dtpart">${hourOptions(9)}</select>

      <label>วันที่สิ้นสุด</label>
      <div class="date-row">
        <select id="f_eday" class="dtpart">${dayOptions()}</select>
        <select id="f_emonth" class="dtpart">${monthOptions()}</select>
        <select id="f_eyear" class="dtpart">${yearOptions()}</select>
      </div>
      <label>เวลาสิ้นสุด (24 ชม.)</label>
      <div class="time-row">
        <select id="f_ehour" class="dtpart">${hourOptions(18)}</select>
        <select id="f_emin" class="dtpart">${minuteOptions(0)}</select>
      </div>

      <div class="summary-box" id="summary">กรอกวันเวลาให้ครบเพื่อดูสรุปจำนวนวันลา</div>

      <button class="btn" onclick="submitRequest()">ส่งคำร้อง</button>
    </div>
  `;
  ['f_sday','f_smonth','f_syear','f_shour','f_smin','f_eday','f_emonth','f_eyear','f_ehour','f_emin'].forEach(id=>{

}

// สร้าง option สำหรับวัน/เดือน/ปี/ชั่วโมง/นาที แบบไทย 24 ชม. DD/MM/YYYY
function pad2(n){ return n.toString().padStart(2,'0'); }
function dayOptions(sel){
  let html='';
  for(let d=1; d<=31; d++) html+=`<option value="${pad2(d)}" ${d===sel?'selected':''}>${pad2(d)}</option>`;
  return html;
}
function monthOptions(sel){
  const names=['01','02','03','04','05','06','07','08','09','10','11','12'];
  let html='';
  names.forEach((m,i)=>{ html+=`<option value="${m}" ${(i+1)===sel?'selected':''}>${m}</option>`; });
  return html;
}
function yearOptions(sel){
  const now=new Date().getFullYear();
  let html='';
  for(let y=now-1; y<=now+2; y++) html+=`<option value="${y}" ${y===sel?'selected':''}>${y}</option>`;
  return html;
}
function hourOptions(sel){
  let html='';
  for(let h=0; h<=23; h++) html+=`<option value="${pad2(h)}" ${h===sel?'selected':''}>${pad2(h)}</option>`;
  return html;
}
function minuteOptions(sel){
  let html='';
  for(let m=0; m<=59; m++) html+=`<option value="${pad2(m)}" ${m===sel?'selected':''}>${pad2(m)}</option>`;
  return html;
}

function getFormDateTime(){
  const sday=document.getElementById('f_sday').value;
  const smonth=document.getElementById('f_smonth').value;
  const syear=document.getElementById('f_syear').value;
  const shour=document.getElementById('f_shour').value;
  const smin=document.getElementById('f_smin').value;
  const eday=document.getElementById('f_eday').value;
  const emonth=document.getElementById('f_emonth').value;
  const eyear=document.getElementById('f_eyear').value;
  const ehour=document.getElementById('f_ehour').value;
  const emin=document.getElementById('f_emin').value;
  return {
    sd: `${syear}-${smonth}-${sday}`, st: `${shour}:${smin}`,
    ed: `${eyear}-${emonth}-${eday}`, et: `${ehour}:${emin}`
  };
}

function computeDuration(){
  const {sd,st,ed,et} = getFormDateTime();
  if(!sd||!st||!ed||!et) return null;
  const start=new Date(`${sd}T${st}`);
  const end=new Date(`${ed}T${et}`);
  let diffMs = end - start;
  if(diffMs<=0) return {error:true};
  let totalMinutes = Math.round(diffMs/60000);
  const days = Math.floor(totalMinutes/ (60*24));
  totalMinutes -= days*60*24;
  const hours = Math.floor(totalMinutes/60);
  const minutes = totalMinutes - hours*60;
  const totalDaysDecimal = +(diffMs/(1000*60*60*24)).toFixed(2);
  return {days,hours,minutes,totalDaysDecimal};
}

function updateSummary(){
  const r = computeDuration();
  const box = document.getElementById('summary');
  if(!r){ box.innerHTML='กรอกวันเวลาให้ครบเพื่อดูสรุปจำนวนวันลา'; return; }
  if(r.error){ box.innerHTML='<span style="color:var(--danger)">เวลาสิ้นสุดต้องอยู่หลังเวลาเริ่มลา</span>'; return; }
  box.innerHTML = `สรุป: <b>${r.days} วัน ${r.hours} ชม. ${r.minutes} นาที</b> (รวม ${r.totalDaysDecimal} วัน)`;
}

async function submitRequest(){
  const first=document.getElementById('f_first').value.trim();
  const last=document.getElementById('f_last').value.trim();
  const phone=document.getElementById('f_phone').value.trim();
  const type=document.getElementById('f_type').value;
  const {sd,st,ed,et} = getFormDateTime();

  if(!first||!last||!phone||!sd||!st||!ed||!et){ toast('กรุณากรอกข้อมูลให้ครบ'); return; }
  const r = computeDuration();
  if(!r || r.error){ toast('วันเวลาไม่ถูกต้อง'); return; }

  const { data, error } = await sb.from('leave_requests').insert({
    first_name:first, last_name:last, phone,
    leave_type:type,
    start_date:sd, start_time:st, end_date:ed, end_time:et,
    total_days:r.days, total_hours:r.hours, total_minutes:r.minutes
  }).select().single();

  if(error){ toast('ส่งคำร้องไม่สำเร็จ: '+error.message); return; }

  toast('ส่งคำร้องเรียบร้อย');
  notifyAdmins(`📋 คำร้องลาใหม่\n${first} ${last} (${phone})\nประเภท: ${type}\nวันที่: ${fmtDate(sd)} ${st} - ${fmtDate(ed)} ${et}\nรวม ${r.days} วัน ${r.hours} ชม. ${r.minutes} นาที`);
  go('home');
}

// ==================== 2. แนบเอกสารการลา ====================
let selectedRequestId = null;
let pendingFiles = [];

function renderDocuments(){
  app.innerHTML = `
    ${header('แนบเอกสารการลา', true)}
    <div class="card">
      <label>ชื่อ</label>
      <input id="d_first" type="text" placeholder="ชื่อ">
      <label>นามสกุล</label>
      <input id="d_last" type="text" placeholder="นามสกุล">
      <button class="btn secondary" onclick="searchMyRequests()">ค้นหาคำร้องของฉัน</button>
    </div>
    <div id="my-requests"></div>
    <div class="card" id="upload-section" style="display:none;">
      <label>แนบไฟล์เอกสาร</label>
      <div class="file-input-row">
        <label class="file-btn">📷 ถ่ายภาพ
          <input type="file" accept="image/*" capture="environment" onchange="handleFiles(event)">
        </label>
        <label class="file-btn">🖼️ เลือกจากคลังภาพ
          <input type="file" accept="image/*" multiple onchange="handleFiles(event)">
        </label>
      </div>
      <div class="preview-grid" id="preview-grid"></div>
      <button class="btn" onclick="uploadDocuments()">อัปโหลดเอกสาร</button>
    </div>
  `;
}

async function searchMyRequests(){
  const first=document.getElementById('d_first').value.trim();
  const last=document.getElementById('d_last').value.trim();
  if(!first||!last){ toast('กรอกชื่อ-นามสกุลก่อน'); return; }

  const { data, error } = await sb.from('leave_requests')
    .select('*')
    .ilike('first_name', first)
    .ilike('last_name', last)
    .order('created_at', {ascending:false})
    .limit(10);

  const box = document.getElementById('my-requests');
  if(error || !data || data.length===0){
    box.innerHTML = `<div class="empty">ไม่พบคำร้องของ ${first} ${last} — กรุณาส่งคำร้องขอลาก่อน</div>`;
    document.getElementById('upload-section').style.display='none';
    return;
  }
  box.innerHTML = data.map(r=>`
    <div class="req-item" style="cursor:pointer" onclick="selectRequest('${r.id}', this)">
      <div class="top-row">
        <span class="type">${r.leave_type}</span>
        <span class="status-pill status-${statusClass(r.status)}">${r.status}</span>
      </div>
      <div class="meta">${fmtDate(r.start_date)} ${r.start_time} — ${fmtDate(r.end_date)} ${r.end_time}<br>
      รวม ${r.total_days} วัน ${r.total_hours} ชม. ${r.total_minutes} นาที</div>
    </div>
  `).join('');
}

function selectRequest(id, el){
  selectedRequestId = id;
  document.querySelectorAll('.req-item').forEach(e=>e.style.borderColor='var(--border)');
  el.style.borderColor = 'var(--accent)';
  document.getElementById('upload-section').style.display='block';
  pendingFiles = [];
  document.getElementById('preview-grid').innerHTML='';
}

function handleFiles(event){
  const files = Array.from(event.target.files);
  files.forEach(f=>{
    pendingFiles.push(f);
    const reader = new FileReader();
    reader.onload = e=>{
      const img = document.createElement('img');
      img.src = e.target.result;
      document.getElementById('preview-grid').appendChild(img);
    };
    reader.readAsDataURL(f);
  });
}

async function uploadDocuments(){
  if(!selectedRequestId){ toast('กรุณาเลือกคำร้องก่อน'); return; }
  if(pendingFiles.length===0){ toast('กรุณาเลือกไฟล์ก่อน'); return; }
  const first=document.getElementById('d_first').value.trim();
  const last=document.getElementById('d_last').value.trim();

  toast('กำลังอัปโหลด...');
  for(const file of pendingFiles){
    const path = `${selectedRequestId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, file);
    if(upErr){ toast('อัปโหลดล้มเหลว: '+upErr.message); continue; }
    const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    await sb.from('leave_documents').insert({
      leave_request_id: selectedRequestId,
      first_name:first, last_name:last,
      file_path: path, file_url: urlData.publicUrl
    });
  }
  toast('อัปโหลดเอกสารเรียบร้อย');
  pendingFiles = [];
  document.getElementById('preview-grid').innerHTML='';
}

function statusClass(status){
  if(status==='อนุมัติ') return 'approved';
  if(status==='ไม่อนุมัติ') return 'rejected';
  return 'pending';
}

let allRequestsCache = [];
let allDocsCache = {};

async function renderAdminDashboard(){
  app.innerHTML = `
    ${header('แดชบอร์ดผู้ดูแล', true)}
    <div class="card">
      <div class="month-filter">
        <select id="month-select" style="flex:1"></select>
        <select id="person-select" style="flex:1"></select>
      </div>
      <button class="btn secondary small" onclick="exportPDF()">📄 ส่งออกรายงาน PDF</button>
    </div>
    <div id="admin-list"><div class="empty">กำลังโหลดข้อมูล...</div></div>
  `;
  await loadAdminData();
}

async function loadAdminData(){
  const { data: reqs, error } = await sb.from('leave_requests')
    .select('*').order('created_at', {ascending:false});
  if(error){ toast('โหลดข้อมูลไม่สำเร็จ'); return; }
  allRequestsCache = reqs || [];

  const { data: docs } = await sb.from('leave_documents').select('*');
  allDocsCache = {};
  (docs||[]).forEach(d=>{
    if(!allDocsCache[d.leave_request_id]) allDocsCache[d.leave_request_id]=[];
    allDocsCache[d.leave_request_id].push(d);
  });

  populateFilters();
  renderPersonGroups(allRequestsCache);
}

function populateFilters(){
  const months = new Set();
  const persons = new Set();
  allRequestsCache.forEach(r=>{
    months.add(r.start_date.slice(0,7));
    persons.add(`${r.first_name} ${r.last_name}`);
  });
  const monthSel = document.getElementById('month-select');
  monthSel.innerHTML = `<option value="">ทุกเดือน</option>` +
    [...months].sort().reverse().map(m=>`<option value="${m}">${m}</option>`).join('');
  const personSel = document.getElementById('person-select');
  personSel.innerHTML = `<option value="">ทุกคน</option>` +
    [...persons].sort().map(p=>`<option value="${p}">${p}</option>`).join('');
  monthSel.onchange = applyFilters;
  personSel.onchange = applyFilters;
}

function applyFilters(){
  const month = document.getElementById('month-select').value;
  const person = document.getElementById('person-select').value;
  let filtered = allRequestsCache;
  if(month) filtered = filtered.filter(r=>r.start_date.slice(0,7)===month);
  if(person) filtered = filtered.filter(r=>`${r.first_name} ${r.last_name}`===person);
  renderPersonGroups(filtered);
}

function renderPersonGroups(list){
  const box = document.getElementById('admin-list');
  if(list.length===0){ box.innerHTML = `<div class="empty">ไม่พบคำร้อง</div>`; return; }

  const grouped = {};
  list.forEach(r=>{
    const key = `${r.first_name} ${r.last_name}`;
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(r);
  });

  box.innerHTML = Object.keys(grouped).sort().map(name=>{
    const items = grouped[name];
    return `
    <details class="person-group">
      <summary>${name} <span class="status-pill status-pending">${items.length} รายการ</span></summary>
      <div class="person-body">
        ${items.map(r=>renderAdminReqItem(r)).join('')}
      </div>
    </details>`;
  }).join('');
}

function renderAdminReqItem(r){
  const docs = allDocsCache[r.id] || [];
  return `
    <div class="req-item">
      <div class="top-row">
        <span class="type">${r.leave_type}</span>
        <span class="status-pill status-${statusClass(r.status)}">${r.status}</span>
      </div>
      <div class="meta">
        โทร: ${r.phone}<br>
        ${fmtDate(r.start_date)} ${r.start_time} — ${fmtDate(r.end_date)} ${r.end_time}<br>
        รวม ${r.total_days} วัน ${r.total_hours} ชม. ${r.total_minutes} นาที
      </div>
      ${docs.length ? `<div class="thumbs">${docs.map(d=>`<img src="${d.file_url}" onclick="viewImage('${d.file_url}')">`).join('')}</div>` : `<div class="meta" style="margin-top:6px;opacity:.6">ยังไม่มีเอกสารแนบ</div>`}
      ${r.status==='รออนุมัติ' ? `
      <div class="action-row">
        <button class="btn ok small" style="flex:1" onclick="decideRequest('${r.id}','อนุมัติ')">อนุมัติ</button>
        <button class="btn danger small" style="flex:1" onclick="decideRequest('${r.id}','ไม่อนุมัติ')">ไม่อนุมัติ</button>
      </div>` : `<div class="meta" style="margin-top:8px">โดย ${r.approved_by||'-'} • ${r.approved_at?fmtDate(r.approved_at):''}</div>`}
    </div>
  `;
}

function viewImage(url){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.onclick=()=>overlay.remove();
  overlay.innerHTML = `<img src="${url}">`;
  document.body.appendChild(overlay);
}

async function decideRequest(id, status){
  const { data, error } = await sb.from('leave_requests').update({
    status, approved_by:'ผู้ดูแล', approved_at:new Date().toISOString()
  }).eq('id', id).select().single();
  if(error){ toast('อัปเดตไม่สำเร็จ'); return; }
  toast(`บันทึกผล: ${status}`);
  notifyAdmins(`${status==='อนุมัติ'?'✅':'❌'} คำร้องลาของ ${data.first_name} ${data.last_name} ถูก${status}แล้ว`);
  await loadAdminData();
}

// ==================== แจ้งเตือน LINE ====================
async function notifyAdmins(message){
  try{
    await fetch(NOTIFY_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message })
    });
  }catch(e){ console.warn('notify failed', e); }
}

// ==================== Export PDF รายเดือน ====================
function exportPDF(){
  const month = document.getElementById('month-select').value;
  const person = document.getElementById('person-select').value;
  let filtered = allRequestsCache;
  if(month) filtered = filtered.filter(r=>r.start_date.slice(0,7)===month);
  if(person) filtered = filtered.filter(r=>`${r.first_name} ${r.last_name}`===person);

  if(filtered.length===0){ toast('ไม่มีข้อมูลสำหรับส่งออก'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(`Leave Report ${month||'All'} ${person||'All staff'}`, 14, 16);
  doc.setFontSize(9);
  let y = 28;
  doc.text('Name', 14, y); doc.text('Type', 70, y); doc.text('Start', 100, y);
  doc.text('End', 135, y); doc.text('Total', 170, y); doc.text('Status', 190, y);
  y+=6;
  filtered.forEach(r=>{
    if(y>280){ doc.addPage(); y=20; }
    doc.text(`${r.first_name} ${r.last_name}`, 14, y);
    doc.text(r.leave_type, 70, y);
    doc.text(`${r.start_date} ${r.start_time}`, 100, y);
    doc.text(`${r.end_date} ${r.end_time}`, 135, y);
    doc.text(`${r.total_days}d ${r.total_hours}h`, 170, y);
    doc.text(r.status, 190, y);
    y+=7;
  });
  doc.save(`leave-report-${month||'all'}-${person||'all'}.pdf`);
}

// ==================== INIT ====================
render('home');
</script>
</body>
</html>
